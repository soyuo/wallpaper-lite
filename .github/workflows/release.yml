name: Release

# Publishes wallpaper-setup.exe and its SHA-256 as a GitHub release.
# - Push a tag such as v0.1.0 that points at a commit on main, or
# - run the workflow by hand from main and give the tag to create.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to create, for example v0.1.0 (must match the app version)
        required: true
        type: string
      prerelease:
        description: Mark the release as a pre-release
        required: true
        default: true
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Check and build the setup program
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check the tag, the branch and the version
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+(-[0-9A-Za-z.]+)?$') {
            throw "Tag '$env:RELEASE_TAG' is not of the form vMAJOR.MINOR.PATCH."
          }
          git fetch --no-tags origin main
          git merge-base --is-ancestor HEAD origin/main
          if ($LASTEXITCODE -ne 0) { throw 'The release commit is not on main.' }
          $version = $env:RELEASE_TAG.Substring(1)
          $tauri = (Get-Content apps/ui/src-tauri/tauri.conf.json -Raw | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ($tauri -ne $version -or $cargo -ne $version) {
            throw "Version mismatch: tag $version, tauri.conf.json $tauri, Cargo.toml $cargo."
          }

      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2.9.3

      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Rust tests
        shell: pwsh
        run: >
          cargo +stable test --locked --workspace
          --exclude wallpaper-renderer --exclude wallpaper-host --exclude wallpaper-ui --exclude wallpaper-setup
          --target x86_64-pc-windows-msvc -- --test-threads=1

      - name: UI tests
        shell: pwsh
        working-directory: apps/ui
        run: |
          $ErrorActionPreference = 'Stop'
          npm ci
          foreach ($t in 'editor','displays','errors','dashboard','playback','performance') {
            npm run "test:$t"
            if ($LASTEXITCODE -ne 0) { throw "test:$t failed." }
          }

      - name: Build the setup program
        shell: pwsh
        run: ./scripts/build-setup.ps1

      - name: Write the checksum
        shell: pwsh
        run: |
          $exe = 'target/x86_64-pc-windows-msvc/release/wallpaper-setup.exe'
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item $exe dist/wallpaper-setup.exe
          "$hash  wallpaper-setup.exe" | Out-File dist/wallpaper-setup.exe.sha256 -Encoding ascii
          Get-Content dist/wallpaper-setup.exe.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: setup
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: setup
          path: dist

      - uses: softprops/action-gh-release@v3.0.4
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || contains(github.ref_name, '-') }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/wallpaper-setup.exe
            dist/wallpaper-setup.exe.sha256
