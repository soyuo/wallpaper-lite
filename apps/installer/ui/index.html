<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>wallpaper Lite</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="setup.css">
</head>
<body>
<div class="blob blob-a" aria-hidden="true"></div>
<div class="blob blob-b" aria-hidden="true"></div>
<main class="card" aria-live="polite">
  <header class="titlebar" data-drag>
    <svg class="logo" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7BA7FF"/><stop offset="1" stop-color="#3B68D8"/></linearGradient></defs>
      <rect width="24" height="24" rx="6" fill="url(#lg)"/>
      <circle cx="16.5" cy="8" r="2.4" fill="#fff"/>
      <path d="M3 16c3-3 5 3 9 0s6 2 9-1v6H3z" fill="#fff" opacity=".9"/>
      <path d="M3 12c3-3 5 3 9 0" fill="none" stroke="#fff" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
    </svg>
    <strong id="title" data-drag>wallpaper Lite</strong>
    <button id="close" class="close" aria-label="Close">&#10005;</button>
  </header>
  <section class="body" id="body"></section>
</main>
<script src="setup.js"></script>
</body>
</html>
