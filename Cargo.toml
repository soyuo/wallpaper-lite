[workspace]
resolver = "3"
members = [
    "crates/core",
    "crates/desktop",
    "crates/renderer",
    "crates/ipc",
    "host",
    "apps/ui/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "BSD-2-Clause"
rust-version = "1.85"

[workspace.dependencies]
wallpaper-core = { path = "crates/core" }
wallpaper-desktop = { path = "crates/desktop" }
wallpaper-renderer = { path = "crates/renderer" }
wallpaper-ipc = { path = "crates/ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", default-features = false, features = ["io-util", "net", "rt", "sync", "time"] }
tracing = "0.1"
tracing-appender = "0.2"
rolling-file = "0.2"
tracing-subscriber = { version = "0.3", features = ["fmt"] }
windows = { version = "=0.61.3", features = [
    "Win32_Foundation",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi",
    "Win32_UI_HiDpi",
] }
